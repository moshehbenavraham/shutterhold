    <!--
      Anti-FOUC theme bootstrap. Runs synchronously before React hydrates so
      dark-OS visitors never see a light-theme flash. Matches the storageKey
      used by next-themes (defaults to "theme").
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved =
            stored === "dark" || stored === "light"
              ? stored
              : prefersDark
                ? "dark"
                : "light";
          var root = document.documentElement;
          if (resolved === "dark") root.classList.add("dark");
          else root.classList.remove("dark");
          root.style.colorScheme = resolved;
        } catch (_) {
          /* localStorage / matchMedia unavailable — fall through to default */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
